name: Lint test and deploy on push
on: push
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: code checkout
        uses: actions/checkout@v7

      - name: Load and cache dependencies
        uses: ./.github/actions/cached-dependency

      - name: lint code
        run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - name: code checkout
        uses: actions/checkout@v7

      - name: Load and cache dependencies
        uses: ./.github/actions/cached-dependency

      - name: Test code
        id: run-test
        run: npm run test

      - name: Upload test report
        if: failure() && steps.run-test.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: test-results.json

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: code checkout
        uses: actions/checkout@v7

      - name: Load and cache dependencies
        uses: ./.github/actions/cached-dependency

      - name: build
        run: npm run build

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-files
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: deployement
        run: echo "Deploying"
      - name: Get build Artifacts
        uses: actions/download-artifact@v5
        with:
          name: dist-files
      - name: Output Contents
        run: ls

  report: 
    needs: [lint, build, deploy, test]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Output Information
        run: |
          echo "Something went wrong" 
          echo "${{ toJSON(github) }}"